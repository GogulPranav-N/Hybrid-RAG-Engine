[project]
name = "hybrid-rag-engine"
version = "0.1.0"
description = "Hybrid RAG system with dense + sparse retrieval, cross-encoder reranking, and Ragas evaluations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    "rank-bm25>=0.2.2",
    "groq>=0.11.0",
    "sse-starlette>=2.1.0",
    "arize-phoenix-otel>=0.6.0",
    "openinference-instrumentation>=0.1.0",
    "ragas>=0.2.0",
    "pymupdf>=1.24.0",
    "tiktoken>=0.7.0",
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
